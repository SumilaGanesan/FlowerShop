<html>

     <head>
        <title>Mika's Flower Paradise</title>
     </head>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#ffd6e8,#ff9ec7,#ff6fa5);
        }

        .container{
            width:380px;
            background:white;
            padding:35px;
            border-radius:20px;
            box-shadow:0 10px 30px rgba(0,0,0,0.2);
            text-align:center;
        }

        h1{
            color:#ff4f8b;
            margin-bottom:8px;
        }

        h3{
            color:#666;
            margin-bottom:25px;
            font-weight:normal;
        }

        input{
            width:100%;
            padding:12px;
            margin:10px 0;
            border:2px solid #ffc1d9;
            border-radius:10px;
            font-size:16px;
            outline:none;
            transition:0.3s;
        }

        input:focus{
            border-color:#ff4f8b;
            box-shadow:0 0 8px rgba(255,79,139,0.4);
        }

        button{
            width:100%;
            padding:12px;
            margin-top:15px;
            border:none;
            border-radius:10px;
            background:linear-gradient(90deg,#ff4f8b,#ff77aa);
            color:white;
            font-size:17px;
            font-weight:bold;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            transform:scale(1.05);
            background:linear-gradient(90deg,#ff2f74,#ff5c99);
        }

        #regmsg{
            margin-top:18px;
            color:#e91e63;
            font-size:18px;
            font-weight:bold;
        }

        .flower{
            font-size:40px;
            margin-bottom:10px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="flower"></div>

    <h1>Mika's Flower Paradise</h1>
    <h3>Login</h3>

    <input type="text" id="loguser" placeholder="Enter your username">

    <input type="password" id="logpwd" placeholder="Enter your password">

    <button onclick="login()"> Login</button>

    <h2 id="regmsg"></h2>
    

</div>

<script>
function login(){

    let user=document.getElementById("loguser").value;
    let pwd=document.getElementById("logpwd").value;

    if(user=="" || pwd==""){
        alert("Please fill all fields.");
    }
    else{
        localStorage.setItem("username",user);
        localStorage.setItem("password",pwd);

        document.getElementById("regmsg").innerHTML="Login Successful!";
    }
}
</script>

</body>
</html>
