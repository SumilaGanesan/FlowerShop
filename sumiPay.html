<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment - Mika's Flower Paradise</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:linear-gradient(135deg,#ffe6f0,#ffd6e8,#fff5f8);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:90%;
    max-width:700px;
    background:#fff;
    border-radius:20px;
    padding:35px;
    box-shadow:0 15px 35px rgba(0,0,0,0.15);
    animation:fadeIn 1s ease;
}

h1{
    text-align:center;
    color:#e91e63;
    margin-bottom:10px;
    font-size:35px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:30px;
    font-size:17px;
}

.shop-name{
    color:#d81b60;
    font-weight:bold;
}

.payment-title{
    font-size:22px;
    color:#444;
    margin-bottom:20px;
    text-align:center;
}

.payment-option{
    display:flex;
    align-items:center;
    background:#fff0f6;
    border:2px solid #ffd1e3;
    border-radius:15px;
    padding:15px;
    margin-bottom:15px;
    cursor:pointer;
    transition:.3s;
}

.payment-option:hover{
    background:#ffe0ec;
    transform:translateY(-4px);
    box-shadow:0 8px 15px rgba(233,30,99,.2);
}

.payment-option input{
    margin-right:15px;
    transform:scale(1.3);
    accent-color:#e91e63;
}

.payment-option label{
    font-size:18px;
    color:#444;
    cursor:pointer;
    width:100%;
}

.info{
    text-align:center;
    margin:25px 0;
    color:#666;
    line-height:1.6;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:30px;
    background:linear-gradient(90deg,#ff4f81,#ff7eb3);
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.03);
    box-shadow:0 8px 18px rgba(255,79,129,.4);
}

.footer{
    margin-top:20px;
    text-align:center;
    color:#888;
    font-size:14px;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>Proceed to a Payment</h1>
    <div class="payment-title">
        Choose Your Payment Method
    </div>

    <div class="payment-option">
        <input type="radio" name="payment" id="card" checked>
        <label for="card">Credit / Debit Card</label>
    </div>

    <div class="payment-option">
        <input type="radio" name="payment" id="netbanking">
        <label for="netbanking">Net Banking</label>
    </div>

    <div class="payment-option">
        <input type="radio" name="payment" id="upi">
        <label for="upi">UPI Payment</label>
    </div>

    <div class="payment-option">
        <input type="radio" name="payment" id="cod">
        <label for="cod">Cash on Delivery</label>
    </div>

    <button onclick="payNow()">Proceed to Pay</button>

</div>

<script>
function payNow(){

    let paymentMethod=document.querySelector('input[name="payment"]:checked').nextElementSibling.innerText;

    alert("Payment Method Selected:\n\n" + paymentMethod + "\n\nThank you for shopping with Mika's Flower Paradise!");
}
</script>

</body>
</html>
