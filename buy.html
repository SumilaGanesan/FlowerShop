<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Review Your Order</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ffd6e7,#ffeef5,#fff8fb);
    overflow:hidden;
}

/* Floating background circles */
body::before,
body::after{
    content:"";
    position:absolute;
    width:350px;
    height:350px;
    border-radius:50%;
    background:rgba(255,255,255,0.25);
    filter:blur(20px);
}

body::before{
    top:-100px;
    left:-100px;
}

body::after{
    bottom:-100px;
    right:-100px;
}

.container{
    position:relative;
    width:430px;
    padding:35px;
    background:rgba(255,255,255,0.75);
    backdrop-filter:blur(15px);
    border-radius:25px;
    box-shadow:0 20px 40px rgba(255,105,180,.25);
    text-align:center;
    animation:float 4s ease-in-out infinite;
}

@keyframes float{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-10px);
    }
}

.icon{
    font-size:70px;
    margin-bottom:10px;
}

h1{
    color:#ff3f80;
    margin-bottom:10px;
}

p{
    color:#666;
    margin-bottom:25px;
    line-height:1.5;
}

.order-box{
    background:#fff7fb;
    border-radius:18px;
    padding:20px;
    margin-bottom:25px;
    box-shadow:0 5px 15px rgba(255,105,180,.1);
}

.item{
    text-align:left;
    margin-bottom:18px;
}

.item label{
    display:block;
    margin-bottom:8px;
    color:#ff4f87;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    border:2px solid #ffd0e3;
    border-radius:12px;
    font-size:15px;
    outline:none;
    transition:.3s;
}

input:focus{
    border-color:#ff4f87;
    box-shadow:0 0 12px rgba(255,79,135,.25);
}

.total{
    background:linear-gradient(90deg,#ff4f87,#ff7eb3);
    color:white;
    padding:15px;
    border-radius:15px;
    font-size:20px;
    font-weight:bold;
    margin-top:10px;
}

.button-group{
    display:flex;
    gap:15px;
}

button{
    flex:1;
    padding:14px;
    border:none;
    border-radius:35px;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
    font-weight:bold;
}

.proceed{
    background:linear-gradient(90deg,#ff3f80,#ff8cb5);
}

.shop{
    background:linear-gradient(90deg,#ffb199,#ff7eb3);
}

button:hover{
    transform:translateY(-4px) scale(1.03);
    box-shadow:0 10px 20px rgba(255,105,180,.35);
}

.footer{
    margin-top:20px;
    color:#999;
    font-size:13px;
}
</style>

<script>
function calculateTotal(){

    let qty=document.getElementById("qty").value;
    let price=document.getElementById("price").value;

    if(qty==""){
        qty=0;
    }

    document.getElementById("total").innerHTML="₹ "+(qty*price);
}

function checkout(){

    let product=document.getElementById("product").value;
    let qty=document.getElementById("qty").value;

    if(product=="" || qty==""){
        alert("Please fill all details.");
        return;
    }

    alert("🌸 Order Confirmed!\n\nThank you for shopping at Mika's Flower Paradise.");
}
</script>

</head>

<body>

<div class="container">

<div class="icon"></div>

<h1>Review Your Order</h1>

<p>Thank you for shopping with <b>Mika's Flower Paradise</b> </p>

<div class="order-box">
<div class="item">
<label>Flower Name</label>
<p id="flowerName">No flower selected</p>
</div>
<div class="item">
<label>🛒 Quantity</label>
<input type="number" id="qty" min="1" placeholder="Enter quantity" oninput="calculateTotal()">
</div>
<div class="item">
<label> Price per Flower (₹)</label>
<p id="price">0</p>
<div class="total">
Price:
<span id="price">₹ 0</span>
</div>

</div>

<div class="button-group">

<button class="proceed" onclick="checkout()">
Proceed 
</button>

<button class="shop" onclick="window.location.href='sumiii.html'">
 Continue Shopping
</button>

</div>

<div class="footer">
Made for flower lovers
</div>

</div>
<script>
const params = new URLSearchParams(window.location.search);
const flower = params.get("flower");

document.getElementById("flowerName").textContent =
    flower || "No flower selected";
document.getElementById("product").value = flower || "";
</script> 

</body>
</html>
